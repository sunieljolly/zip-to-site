name = "sitetozip"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
APP_DOMAIN = "developersunny.com"

# Attach the Worker to the zone so it handles:
#   - *.developersunny.com  — subdomain sites
#   - Custom hostnames (via CF for SaaS) — when Cloudflare routes the request
#     through the fallback origin (a subdomain of developersunny.com), this
#     route matches and the Worker reads the original Host header to serve
#     the correct custom-domain site.
[[routes]]
pattern = "*.developersunny.com/*"
zone_name = "developersunny.com"

[[kv_namespaces]]
binding = "SITES_KV"
id = "29c5fa78310443a7872189ca1c7b7e5f"

[[r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "ziptosite"
